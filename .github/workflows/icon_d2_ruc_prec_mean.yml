name: ICON-D2 RUC EPS Precipitazioni (PREC)

on:
  workflow_dispatch:
  schedule:
    # Il RUC esce ogni ora. Scheduliamo al minuto 45 per essere sicuri che i 27h del run siano completi
    - cron: "45 * * * *"

jobs:
  run-icon-d2-ruc-prec:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_THREAD_ID_2: ${{ secrets.TELEGRAM_THREAD_ID_2 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (cartopy/geospatial)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libproj-dev \
            proj-data \
            proj-bin \
            libgeos-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            g++ \
            gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install numpy matplotlib requests urllib3 pytz xarray cfgrib eccodes earthkit-data earthkit-plots cartopy scipy

      - name: Run script
        run: |
          python icon_d2_ruc_prec_mean.py