name: ICON-D2 EPS LPI Max Medio

on:
  workflow_dispatch:
  schedule:
    # Esecuzione ogni ora al minuto 25 (sfalsato rispetto alla pioggia per evitare sovraccarichi)
    - cron: "25 * * * *"

jobs:
  run-icon-d2-lpi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: "1"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Variabile d'ambiente aggiornata al thread 882
      TELEGRAM_THREAD_ID_882: ${{ secrets.TELEGRAM_THREAD_ID_882 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (cartopy/geospatial)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libproj-dev \
            proj-data \
            proj-bin \
            libgeos-dev \
            libjpeg-dev \
            libpng-dev \
            libfreetype6-dev \
            g++ \
            gcc

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install numpy matplotlib requests urllib3 pytz xarray cfgrib eccodes earthkit-data earthkit-plots cartopy

      - name: Run script
        run: |
          python icon_d2_lpi_mean.py